name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawn-tts-linux-x86_64
          path: |
            build/plugins/pawn_tts.so
            build/components/pawn_tts.so

  windows:
    name: Windows Build (x86 32-bit MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 gcc-mingw-w64-i686

      - name: Configure CMake
        run: |
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix || true
          cmake -B build-win -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++-posix

      - name: Build
        run: cmake --build build-win --config Release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawn-tts-windows-x86
          path: |
            build-win/plugins/pawn_tts.dll
            build-win/components/pawn_tts.dll

